name: Ejecutar Bot de Apuestas
on:
  schedule:
    - cron: '*/30 15-22 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar libreria de internet
        run: pip install requests
      - name: Descargar Script Reparado Directo
        run: curl -sSL https://githubusercontent.com -o bot_europa.py
      - name: Ejecutar Script de Futbol
        run: python bot_europa.py
